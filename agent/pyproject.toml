[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipf3-agent"
version = "1.0.0"
description = "IPF3 monitoring and network test agent for Ubuntu servers"
requires-python = ">=3.10"
dependencies = ["httpx>=0.25", "psutil>=5.9", "dnspython>=2.4"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ipf3-agent = "ipf3_agent.cli:main"

[tool.setuptools.packages.find]
include = ["ipf3_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
