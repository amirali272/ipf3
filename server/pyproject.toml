[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipf3-server"
version = "3.0.0"
description = "IPF3 network monitoring and performance testing control plane"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy[asyncio]>=2.0.29",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.7",
  "email-validator>=2.1",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "pyyaml>=6", "httpx[socks]>=0.27"]

[project.scripts]
ipf3-server = "ipf3_server.cli:main"

[tool.setuptools.packages.find]
include = ["ipf3_server*"]

[tool.setuptools.package-data]
ipf3_server = ["alembic.ini", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
