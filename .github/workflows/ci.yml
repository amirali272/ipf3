name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ipf3_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        working-directory: server
        run: |
          sudo apt-get update -q && echo "iperf3 iperf3/start_daemon boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q iperf3 iputils-ping
          pip install -r requirements.lock -r ../agent/requirements.lock
          pip install --no-deps -e . -e ../agent && pip install pytest pytest-asyncio pyyaml "httpx[socks]"
          curl -fsSL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          mkdir -p /tmp/xray && unzip -q /tmp/xray.zip -d /tmp/xray
      - name: Test
        working-directory: server
        env:
          IPF3_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ipf3_test
          XRAY_BIN: /tmp/xray/xray
        run: pytest -q

  agent:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        working-directory: agent
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e . && pip install pytest pytest-asyncio
      - name: Test
        working-directory: agent
        run: pytest -q

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prebuilt web/dist matches the sources
        run: bash -c 'source deploy/lib.sh; prebuilt_web_ok . || { echo "web/dist is stale: run scripts/build-web.sh and commit web/dist"; exit 1; }'
      - working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck && shellcheck -x -S warning install.sh deploy/*.sh
