; Drop-in for the wireguard-tools package's wg-quick@.service template, scoped to
; the wg0 instance ipf3-wireguard-reload.service manages. Without this, the
; template unit would fail (and systemd would count that as a failure) whenever it
; is started/enabled before the panel has ever pushed a WireGuard inbound for this
; node — exactly like ipf3-xray.service's ConditionPathExists.
[Unit]
ConditionPathExists=/etc/wireguard/wg0.conf
